plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	maven { url "https://maven.shedaniel.me" }
	maven { url "https://maven.terraformersmc.com/" }
	maven {
		name = "Ladysnake Libs"
		url = 'https://maven.ladysnake.org/releases'
	}
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation("maven.modrinth:spell-power:1.2.3+1.21.1")
	modCompileOnly("dev.onyxstudios.cardinal-components-api:cardinal-components-base:6.1.2")
	modCompileOnly("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:6.1.2")
	modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-base:6.1.2")
	modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:6.1.2")
	modCompileOnly("maven.modrinth:trinkets:3.10.0")
	modLocalRuntime("maven.modrinth:trinkets:3.10.0")
	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:15.0.140")
	modCompileOnly("com.terraformersmc:modmenu:11.0.3")
	modImplementation("net.fabricmc.fabric-api:fabric-api:0.115.4+1.21.1")

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}